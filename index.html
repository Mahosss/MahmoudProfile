<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mahmoud</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
body {
  background: #0b0f1a;
  color: #fff;
  font-family: 'Tajawal', sans-serif;
  display: flex;
  justify-content: center;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 40px;
  direction: rtl;
}

.wrapper {
  display: flex;
  gap: 30px;
  justify-content: center;
  align-items: flex-start; 
  flex-wrap: wrap;
}

.profile-column {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.info-column {
  display: flex;
  flex-direction: column;
  justify-content: flex-start; 
}

.profile-pic {
  width: 220px;
  height: 220px;
  border-radius: 20px;
  overflow: hidden;
  border: 3px solid #3498db; 
  box-shadow: 0 0 25px #3498db80;
  transition: 0.4s;
}

.profile-pic img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s;
}

.profile-pic:hover img {
  transform: scale(1.12);
}

.text-box {
  margin-top: 10px;
  text-align: center;
}

.name {
  font-size: 26px;
  font-weight: bold;
  background: linear-gradient(90deg, #1abc9c, #3498db, #1abc9c); 
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% 100%; 
  animation: gradient-slide 3s linear infinite;
  margin-bottom: 10px;
}

@keyframes gradient-slide {
  0% { background-position: 0% 0%; }
  100% { background-position: 200% 0%; }
}

.info-box {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 0; 
}

.info-row {
  background: linear-gradient(135deg, #ffffff10, #ffffff05);
  border: 1px solid #ffffff30;
  padding: 12px 15px;
  border-radius: 16px;
  width: 260px;
  backdrop-filter: blur(6px);
  transition: 0.3s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.info-row:hover {
  transform: translateX(-6px);
  background: linear-gradient(135deg, #ffffff20, #ffffff10);
}

.info-row .q {
  font-weight: bold;
  color: #3498db; 
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 5px; 
}

.info-row .a {
  color: #fff;
  font-size: 14px;
}

.info-row a {
  color: #1abc9c; 
  text-decoration: none;
  font-weight: bold;
}

.info-row a:hover {
  text-decoration: underline;
}

.quote-box {
  background: rgba(52, 152, 219, 0.1); 
  border: 1px solid #3498db80;
  border-radius: 12px;
  padding: 15px 20px;
  width: 100%;
  max-width: 600px;
  margin-top: 30px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 15px #3498db80;
  text-align: center;
}

.quote-box p {
  margin: 5px 0;
  font-size: 16px;
  color: #ecf0f1;
  line-height: 1.5;
}

/* --- مشغل الموسيقى الجديد --- */
.music-player {
  background: rgba(52, 152, 219, 0.08);
  border: 1px solid rgba(52, 152, 219, 0.4);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 600px;
  margin-top: 25px;
  backdrop-filter: blur(8px);
  box-shadow: 0 0 20px rgba(52, 152, 219, 0.25);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.song-title {
  font-size: 16px;
  font-weight: bold;
  color: #1abc9c;
  display: flex;
  align-items: center;
  gap: 8px;
}

.progress-area {
  height: 6px;
  width: 100%;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  cursor: pointer;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #1abc9c, #3498db);
  border-radius: 10px;
  transition: width 0.1s linear;
}

.player-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  margin-top: 5px;
}

.player-btn {
  background: none;
  border: none;
  color: #3498db;
  font-size: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.player-btn:hover {
  color: #1abc9c;
  transform: scale(1.15);
}

.play-main-btn {
  width: 45px;
  height: 45px;
  background: linear-gradient(135deg, #1abc9c, #3498db);
  border-radius: 50%;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  box-shadow: 0 0 12px rgba(26, 188, 156, 0.5);
}

.play-main-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 18px rgba(52, 152, 219, 0.8);
}

@media (max-width: 600px) {
  .wrapper {
    flex-direction: column; 
    align-items: center;
    gap: 20px;
  }

  .info-box, .profile-pic {
    width: 90%; 
    max-width: 300px;
  }

  .music-player, .quote-box {
    width: 90%;
  }
}

::-webkit-scrollbar {
  width: 12px;  
}

::-webkit-scrollbar-track {
  background: #0b0f1a;  
  border-radius: 6px;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #1abc9c, #3498db); 
  border-radius: 6px;
  border: 3px solid #0b0f1a; 
}

::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #3498db, #1abc9c);
}

* {
  scrollbar-width: thin;
  scrollbar-color: #3498db #0b0f1a;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="profile-column">
    <div class="profile-pic">
      <img src="https://img.alfrsantv.com/img/f176506150966251.png" alt="profile">
    </div>

    <div class="text-box">
      <div class="name">¨̶ζ̶̶̶̶̷͜͟͡Maђϻoud</div>
    </div>
  </div>

  <div class="info-column">
    <div class="info-box">

      <div class="info-row">
        <div class="q"><i class="fas fa-map-marker-alt"></i> البلد:</div>
        <div class="a">مصر</div>
      </div>

      <div class="info-row">
        <div class="q"><i class="fas fa-palette"></i> اللون:</div>
        <div class="a">أزرق / موف</div>
      </div>

      <div class="info-row">
        <div class="q"><i class="fas fa-smile"></i> المزاج:</div>
        <div class="a">الحمد لله 🙂</div>
      </div>

      <div class="info-row">
        <div class="q"><i class="fas fa-lightbulb"></i> مهارات:</div>
        <div class="a">برمجة، تصميم</div>
      </div>

      <div class="info-row">
        <div class="q"><i class="fas fa-comments"></i> الشات:</div>
        <div class="a">
          شات ميلودى — 
          <a href="https://xat.com/melodylovers" target="_blank">اضغط هنا</a>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- الجمل -->
<div class="quote-box">
  <p>I Love Talking To You , Even Though I Have Nothing To Say.</p>
  <p>في غيابك ما تغير أي شيء، بس حسيت أني فاقد كل شيء</p>
</div>

<!-- مشغل الموسيقى بديل اليوتيوب -->
<div class="music-player">
  <div class="song-title" id="songTitle">
    <i class="fas fa-music"></i> جاري التحميل...
  </div>
  
  <div class="progress-area" id="progressArea">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="player-controls">
    <button class="player-btn" onclick="prevSong()"><i class="fas fa-step-forward"></i></button>
    <button class="player-btn play-main-btn" id="playBtn"><i class="fas fa-play" id="playIcon"></i></button>
    <button class="player-btn" onclick="nextSong()"><i class="fas fa-step-backward"></i></button>
  </div>

  <audio id="audio"></audio>
</div>

<script>
  // قائمة الأغاني (يمكنك تعديل الأسماء والروابط هنا)
  const songs = [
    { title: "Fadel Shaker - Gowwa.ElRouh", src: "https://melodylovers.com/Song/Fadel.Shaker.Gowwa.ElRouh.mp3" },
    { title: "لحن مميز 2", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
    { title: "موسيقى استرخاء 3", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
  ];

  let songIndex = 0;
  const audio = document.getElementById('audio');
  const songTitle = document.getElementById('songTitle');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progressBar = document.getElementById('progressBar');
  const progressArea = document.getElementById('progressArea');

  function loadSong(song) {
    songTitle.innerHTML = `<i class="fas fa-music"></i> ${song.title}`;
    audio.src = song.src;
  }

  function playSong() {
    audio.play();
    playIcon.className = 'fas fa-pause';
  }

  function pauseSong() {
    audio.pause();
    playIcon.className = 'fas fa-play';
  }

  playBtn.addEventListener('click', () => {
    const isPlaying = !audio.paused;
    if (isPlaying) {
      pauseSong();
    } else {
      playSong();
    }
  });

  function nextSong() {
    songIndex = (songIndex + 1) % songs.length;
    loadSong(songs[songIndex]);
    playSong();
  }

  function prevSong() {
    songIndex = (songIndex - 1 + songs.length) % songs.length;
    loadSong(songs[songIndex]);
    playSong();
  }

  audio.addEventListener('timeupdate', (e) => {
    const { currentTime, duration } = e.target;
    if (duration) {
      const progressPercent = (currentTime / duration) * 100;
      progressBar.style.width = `${progressPercent}%`;
    }
  });

  progressArea.addEventListener('click', (e) => {
    const width = progressArea.clientWidth;
    const clickX = e.offsetX;
    const duration = audio.duration;
    if (duration) {
      audio.currentTime = (clickX / width) * duration;
    }
  });

  audio.addEventListener('ended', nextSong);

  // تحميل الأغنية الأولى عند البداية
  loadSong(songs[songIndex]);
</script>

</body>
</html>
